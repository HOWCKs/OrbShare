name: OrbShare - Build APK Release (Cloud)

on:
  push:
    branches: [ "arena/01a01f7e-orbshare", "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ./app
        run: |
          npm install -g expo-cli
          npm install
          npm install -g eas-cli

      - name: Create placeholder assets (if missing)
        working-directory: ./app
        run: |
          mkdir -p assets
          if [ ! -f assets/icon.png ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8Xw8AAn0B9pA7WAAAAABJRU5ErkJggg==" | base64 -d > assets/icon.png
          fi
          cp assets/icon.png assets/adaptive-icon.png 2>/dev/null || true
          cp assets/icon.png assets/splash.png 2>/dev/null || true

      - name: Prebuild Android (Expo -> native)
        working-directory: ./app
        run: |
          npx expo prebuild --clean --platform android --no-install
          ls -la android/

      - name: Generate Release Keystore (auto)
        working-directory: ./app/android
        run: |
          if [ ! -f app/release.keystore ]; then
            keytool -genkeypair -v -keystore app/release.keystore -alias orbshare -keyalg RSA -keysize 2048 -validity 10000 -storepass orbshare123 -keypass orbshare123 -dname "CN=OrbShare, OU=Orb, O=OrbShare, L=City, S=State, C=BR"
          fi
          echo "storeFile=release.keystore" > app/keystore.properties
          echo "storePassword=orbshare123" >> app/keystore.properties
          echo "keyAlias=orbshare" >> app/keystore.properties
          echo "keyPassword=orbshare123" >> app/keystore.properties

      - name: Configure Gradle for Release Signing
        working-directory: ./app/android
        run: |
          cat >> app/build.gradle << 'EOF'

          def keystorePropsFile = file('keystore.properties')
          def keystoreProps = new Properties()
          if (keystorePropsFile.exists()) {
            keystoreProps.load(new FileInputStream(keystorePropsFile))
          }
          android {
            signingConfigs {
              release {
                if (keystoreProps['storeFile']) {
                  storeFile file(keystoreProps['storeFile'])
                  storePassword keystoreProps['storePassword']
                  keyAlias keystoreProps['keyAlias']
                  keyPassword keystoreProps['keyPassword']
                }
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
                minifyEnabled false
                shrinkResources false
              }
            }
          }
          EOF

      - name: Build Release APK
        working-directory: ./app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrbShare-release-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: OrbShare v0.1.${{ github.run_number }} - Release APK
          body: |
            🚀 OrbShare MVP Release - Build na nuvem 100% no celular!
          files: app/android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
